# Shared per-project routing body.
# Expects two variables to be set by the including server block:
#   $project  - project directory name (or path) under /var/www/html
#   $fpm      - php-fpm backend as host:port

# Smart framework / Laravel project detection
set $project_root /var/www/html/$project;
if (-d /var/www/html/$project/public) {
    set $project_root /var/www/html/$project/public;
}
if (-f /var/www/html/$project/artisan) {
    set $project_root /var/www/html/$project/public;
}
if (-f /var/www/html/$project/index.php) {
    set $project_root /var/www/html/$project;
}

root $project_root;

index index.php index.html;
charset utf-8;
client_max_body_size 100M;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

location ~ \.php$ {
    fastcgi_pass $fpm;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    include fastcgi_params;
}

location ~ /\.(?!well-known).* { deny all; }
