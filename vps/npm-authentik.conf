# Authentik forward-auth gate for Nginx Proxy Manager — paste this ENTIRE file
# into the proxy host's "Advanced" tab. Leave "Custom Locations" empty.
#
# IMPORTANT: paste every section (buffer vars, location /, outpost location,
# @goauthentik_proxy_signin). A partial paste fails validation with
# `unknown "ak_http_host" variable` and NPM silently keeps the config inactive
# as /data/nginx/proxy_host/<id>.conf.err — the app then serves ungated.
#
# Replace AUTHENTIK_ORIGIN with the authentik server reachable from the NPM
# container — e.g. http://authentik-server:9000 when both share a Docker
# network (container names from `docker ps`). Prefer this internal hop over
# your public https:// URL: the public path hairpins through Cloudflare and
# fails TLS handshakes without extra proxy_ssl_* settings.
#
# Requires an Authentik "Forward auth (single application)" provider whose
# External host is exactly https://<this-host> (same scheme and host the
# browser uses).

# Increase buffer size for large headers
proxy_buffers 8 16k;
proxy_buffer_size 32k;

# Make sure not to redirect traffic to a port 4443
port_in_redirect off;

# Preserve an explicit Host header (the outpost matches providers on it)
set $ak_http_host $http_host;
if ($ak_http_host = "") {
    set $ak_http_host $host;
}

location ~ ^/livewire-[0-9a-f]+/(update|upload-file)$ {
    include conf.d/include/proxy.conf;
}

location / {
    auth_request     /outpost.goauthentik.io/auth/nginx;
    error_page       401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header       Set-Cookie $auth_cookie;

    # translate headers from the outpost back to the actual upstream
    auth_request_set $authentik_username $upstream_http_x_authentik_username;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
    auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
    auth_request_set $authentik_email $upstream_http_x_authentik_email;
    auth_request_set $authentik_name $upstream_http_x_authentik_name;
    auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

    proxy_set_header X-authentik-username $authentik_username;
    proxy_set_header X-authentik-groups $authentik_groups;
    proxy_set_header X-authentik-entitlements $authentik_entitlements;
    proxy_set_header X-authentik-email $authentik_email;
    proxy_set_header X-authentik-name $authentik_name;
    proxy_set_header X-authentik-uid $authentik_uid;

    # Support for websocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    # Proxy!
    include conf.d/include/proxy.conf;
}

# all requests to /outpost.goauthentik.io must be accessible without authentication
location /outpost.goauthentik.io {
    proxy_pass              http://authentik-server:9000/outpost.goauthentik.io;
    proxy_set_header        Host $ak_http_host;
    proxy_set_header        X-Original-URL https://$ak_http_host$request_uri;
    add_header              Set-Cookie $auth_cookie;
    auth_request_set        $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
}

# Special location for when the /auth endpoint returns a 401,
# redirect to the /start URL which initiates SSO
location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 https://$ak_http_host/outpost.goauthentik.io/start?rd=https://$ak_http_host$request_uri;
}
