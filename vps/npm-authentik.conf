# Authentik forward-auth gate for Nginx Proxy Manager.
# Paste into the proxy host's "Advanced" tab. Leave "Custom Locations" empty.
#
# Replace AUTHENTIK_ORIGIN with the authentik server URL reachable from the NPM
# container (e.g. http://authentik-server:9000 if both share a Docker network,
# or https://authentik.<your-domain>).
#
# Requires an Authentik "Forward Auth" provider + outpost. If your authentik
# version's snippet differs, use the one it generates:
#   https://goauthentik.io/docs/add-secure-apps/forward-auth-nginx/

location / {
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @goauthentik_proxy_signin;

    auth_request_set $authentik_user $upstream_http_x_authentik_username;
    auth_request_set $authentik_email $upstream_http_x_authentik_email;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
    auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
    auth_request_set $authentik_name $upstream_http_x_authentik_name;
    auth_request_set $authentik_uid $upstream_http_x_authentik_uid;
    auth_request_set $authentik_set_cookie $upstream_http_set_cookie;

    proxy_set_header X-authentik-username $authentik_user;
    proxy_set_header X-authentik-email $authentik_email;
    proxy_set_header X-authentik-groups $authentik_groups;
    proxy_set_header X-authentik-entitlements $authentik_entitlements;
    proxy_set_header X-authentik-name $authentik_name;
    proxy_set_header X-authentik-uid $authentik_uid;

    include /etc/nginx/proxy.conf;
    proxy_pass $forward_scheme://$server_name:$port;
}

# Auth requests to the authentik outpost (forward-auth endpoint)
location /outpost.goauthentik.io {
    proxy_pass http://AUTHENTIK_ORIGIN/outpost.goauthentik.io;
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_buffering off;
}

# Unauthenticated users are sent to authentik's login/start flow
location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $authentik_set_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}
